 <div class="brand"><span class="brandmark" aria-hidden="true">〰</span>DailyFlow</div><p class="tagline">把生活的片段，连成完整的你</p>
 <label class="search"><span aria-hidden="true">⌕</span><input id="search" placeholder="搜索经历" aria-label="搜索经历"></label>
 <button class="outline new" data-action="new">＋ 新建经历</button><div class="nav-label">我的经历</div><nav class="directory" id="directory"></nav>
 <div class="side-bottom"><button class="side-action" data-action="space"><span class="icon" aria-hidden="true">♧</span><span>我的空间<small>保存在这台设备</small></span></button><button class="side-action" id="settings-toggle" data-action="settings" aria-expanded="false"><span class="icon" aria-hidden="true">⚙</span>设置</button></div>
 <div class="settings-menu" id="settings" hidden><strong>设置</strong><button data-action="sources">↗　连接与授权</button><button data-action="import">▱　文件导入</button><button data-action="cloud">☁　备份与同步 <small>规划中</small></button><button data-action="reset">↺　重置演示</button></div>
</aside>
<main class="workspace"><div class="scroll-main" id="scroll-main"><div class="breadcrumb"><span><button class="mobile-menu" data-action="menu" aria-label="展开经历目录">☰</button>我的经历 <span style="margin:0 9px">/</span><span id="crumb"></span></span><span class="preview-tag">交互原型 · 模拟数据</span></div><div id="content"></div></div>

</main>

</div>

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{notify('浏览器限制本地存储，本次操作仅在当前页面保留。');}}
function notify(message,undoFn){clearTimeout(toastTimer);undo=undoFn||null;$('toast').innerHTML='<span>'+esc(message)+'</span>'+(undo?'<button data-action="undo">撤销</button>':'');$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,6500);}
function modal(title,body){$('modal-title').textContent=title;$('modal-body').innerHTML=body;if(!$('modal').open)$('modal').showModal();}
function renderDirectory(){const q=$('search').value.trim().toLowerCase();$('directory').innerHTML=state.stories.filter(s=>s.name.toLowerCase().includes(q)).map(s=>'<button class="story-button '+(s.id===story().id?'active':'')+'" data-action="story" data-id="'+esc(s.id)+'" '+(s.id===story().id?'aria-current="page"':'')+'><span>'+esc(s.name)+'</span>'+(s.groups.some(g=>g.pending&&!state.confirmed[key(s.id,g.id)])?'<span class="dot" aria-label="有待确认关联"></span>':'')+'</button>').join('')||'<p class="meta" style="padding:10px">没有找到这段经历</p>';}
function row(s,r){return '<button class="record '+(selected===r.id?'is-selected':'')+'" data-action="detail" data-id="'+esc(r.id)+'" aria-label="查看'+esc(r.title)+'详情">'+(r.image&&r.tag?'<img class="thumb" src="'+photo+'" alt="模拟攀岩场景">':'')+'<span class="source-icon '+r.source+'" aria-hidden="true">'+symbols[r.source]+'</span><span class="source-name">'+names[r.source]+'</span><span class="record-copy"><span class="record-title">'+esc(r.short||r.title)+'</span>'+(r.tag?'<span class="record-sub">'+esc(r.tag)+'</span>':'')+'</span>'+(r.amount!=null?'<span class="record-value">¥'+r.amount.toFixed(2)+'</span>':r.value?'<span class="record-value">'+esc(r.value)+'</span>':'')+'<span class="record-arrow" aria-hidden="true">›</span></button>';}
function render(){const s=story();renderDirectory();$('crumb').textContent=s.short;const rows=all(s).filter(r=>visible(s,r)),excluded=all(s).filter(r=>state.excluded[key(s.id,r.id)]).length,sources=[...new Set(rows.map(r=>r.source))];
 $('content').innerHTML='<div class="hero"><div><h1>'+esc(s.name)+'</h1><div class="meta">'+esc(s.range)+' · '+sources.length+' 个来源 · '+rows.length+' 条记录　<span class="pill amber">模拟数据</span></div></div><button class="outline update-button" data-action="update">↻ 更新来源</button></div><div class="source-summary">'+sources.map(x=>'<button class="source-chip" data-action="sources">'+symbols[x]+' '+names[x]+'</button>').join('')+'<button class="text-button" data-action="sources" aria-label="管理这段经历使用的数据来源">查看范围 ›</button></div><div class="summary"><span class="spark" aria-hidden="true">✦</span><div><p>'+esc(s.summary)+'</p><small>示例概括 · 可通过下方记录核对</small>　<button class="text-button" data-action="process">整理过程</button></div></div><div class="change-strip"><span>'+ (state.updated[s.id]?'本次演示更新：更正 1 条 · 已同步':'来源状态：样本已载入 · 保存在本机')+'</span><button class="text-button" data-action="changes">查看变化 ›</button></div><div class="section-line"><span>沿着时间，回看这段经历</span>'+(excluded?'<button class="text-button" data-action="excluded">已排除 '+excluded+' 条 · 管理</button>':'<span>按发生时间排列</span>')+'</div><div class="timeline">'+s.groups.map(g=>{const rs=g.records.filter(r=>visible(s,r));if(!rs.length)return '';const pending=g.pending&&!state.confirmed[key(s.id,g.id)];return '<section class="event"><div class="date">'+esc(g.date)+'</div><div class="group"><div class="group-head"><h3>'+esc(g.title)+'</h3>'+(!pending&&g.records.length>1?'<span class="pill">已确认</span>':'')+'</div><div class="event-card '+(rs.some(r=>r.id===selected)?'selected':'')+'">'+rs.map(r=>row(s,r)).join('')+(g.pending?'<div class="relationship"><span class="reason">↗ '+esc(g.reason)+'</span><div class="relation-actions">'+(pending?'<span class="pill amber">待确认</span><button class="primary" data-action="confirm" data-id="'+g.id+'">确认相关</button><button class="secondary" data-action="review" data-id="'+g.id+'">不相关</button>':'<span class="pill">你已确认</span><button class="text-button" data-action="unconfirm" data-id="'+g.id+'">重新判断</button>')+'</div></div>':'')+'</div></div></section>';}).join('')+(rows.length?'':'<div class="empty"><h3>给这段经历一点线索</h3><p>先载入模拟样本，或在设置中选择可用来源。</p><button class="outline" data-action="import">载入演示样本</button></div>')+'</div>';
 renderDetail();}
function renderDetail(){const s=story(),r=all(s).find(r=>r.id===selected&&visible(s,r));$('detail').hidden=!r;$('app').classList.toggle('no-detail',!r);if(!r)return;const confirmed=!r.group.pending||state.confirmed[key(s.id,r.group.id)];$('detail').innerHTML='<div class="detail-top"><div><h2>记录详情</h2><p>来自模拟'+names[r.source]+' · '+esc(r.time.split(' ')[0])+'</p></div><button class="close" data-action="close-detail" aria-label="关闭记录详情">×</button></div><div class="detail-divider"></div><h3>'+esc(r.title)+'</h3>'+(r.image?'<img class="detail-photo" src="'+photo+'" alt="室内攀岩场景，AI生成示意配图">':r.amount!=null?'<div class="amount-hero">¥'+r.amount.toFixed(2)+'</div>':'')+'<p class="detail-body">'+esc(r.body)+'</p><div class="detail-divider"></div><dl class="meta-table"><dt>来源</dt><dd>模拟'+names[r.source]+'</dd><dt>记录时间</dt><dd>'+esc(r.time)+'</dd></dl><button class="text-button" data-action="original">查看原始记录 ↗</button><div class="detail-divider"></div><div class="detail-top"><h3 class="why">为什么出现在这里</h3><span class="pill '+(confirmed?'':'amber')+'">'+(confirmed?'已确认':'待你确认')+'</span></div><p class="reason-text">'+esc(r.group.reason||'这条记录属于当前经历的演示样本，日期在所选范围内。')+'</p><div class="detail-divider"></div><button class="text-button" data-action="changes">查看更新记录 ›</button><button class="remove" data-action="exclude" data-id="'+esc(r.id)+'">⊘ 从这段经历中移除</button><p class="helper">仅移除关联，原记录仍保留</p><div class="footnote">DailyFlow · 交互概念稿</div>';}
function exclude(rid){const s=story(),k=key(s.id,rid),previous=state.excluded[k];state.excluded[k]=true;if(selected===rid)selected=null;save();render();notify('已从这段经历中移除，原记录保留。',()=>{previous?state.excluded[k]=previous:delete state.excluded[k];save();render();});}
function sourcesModal(){modal('连接与授权','<p>这些开关只控制演示样本的显示，不会连接真实账号或申请系统权限。</p>'+Object.keys(names).map(x=>'<label class="source-setting"><span><strong>模拟'+names[x]+'</strong><small>'+({social:'动态、收藏与配文',calendar:'日程名称与发生时间',expense:'金额、日期与备注'}[x])+'</small></span><input type="checkbox" data-source="'+x+'" '+(state.connected[x]?'checked':'')+' aria-label="显示模拟'+names[x]+'"></label>').join('')+'<p style="margin-top:18px">范围：当前原型的全部样本。关闭后相关记录从经历视图隐藏，原样本不会删除。</p>');}
function changes(){const logs=state.logs[story().id]||[];modal('这段经历的变化',logs.length?logs.map(l=>'<div class="log-row"><strong>'+esc(l.type)+'</strong>'+esc(l.text)+'<br><small class="meta">本次原型会话 · 模拟来源</small></div>').join(''):'<p>样本已载入，尚无更新。点击“更新来源”，演示一条费用更正如何反映到时间流。</p>');}
function newStory(){modal('开始一段新经历','<p>给你想整理的经历起个名字。新建后可以载入演示样本。</p><form id="new-form"><label class="field" for="story-name">经历名称</label><input class="input" id="story-name" maxlength="40" placeholder="例如：从灵感到第一件作品" required><div class="modal-footer"><button type="button" class="secondary" data-action="close-modal">取消</button><button type="submit" class="primary">创建经历</button></div></form>');setTimeout(()=>$('story-name').focus(),30);}
function ask(q){if(running)return;const s=story();running=true;const myRun=++runId;modal('Agent 整理 · 模拟演示','<p>“'+esc(q)+'”</p><p>下面展示预设交互流程，没有真实模型或工具调用。</p><div id="agent-log"><div class="log-row">◌ 正在匹配演示问题…</div></div><div class="modal-footer"><button class="secondary" data-action="cancel-run">取消整理</button></div>');setTimeout(()=>{if(myRun!==runId)return;const rows=all(s).filter(r=>visible(s,r));$('agent-log').innerHTML='<div class="log-row"><strong>✓</strong>读取当前经历的 '+rows.length+' 条可见样本</div><div class="log-row">◌ 整理可核对的结果…</div>';},450);setTimeout(()=>{if(myRun!==runId)return;running=false;const rows=all(s).filter(r=>visible(s,r)),expenses=rows.filter(r=>r.amount!=null);let response;if(/多少|花|钱|投入|费用|支出/.test(q)){response='当前可见样本包含 '+expenses.length+' 笔支出，合计 ¥'+expenses.reduce((a,r)=>a+r.amount,0).toFixed(2)+'。已排除记录与关闭的来源不参与此演示计算。';}else if(/演出/.test(q)&&s.id!=='concert'){response='你可以切换到“从期待演出到散场”，查看另一组经历样本。';}else if(/过程|经历|攀岩|串|整理|发生|回顾/.test(q)){response=s.summary;}else{response='这个原型只演示费用汇总和经历回顾。你的问题未被支持，没有执行任何写入。';}modal('整理结果 · 模拟演示','<p>'+esc(q)+'</p><div class="log-row"><strong>✓</strong>根据当前可见样本计算 / 展示</div><p style="font-size:15px;color:var(--ink);margin:20px 0">'+esc(response)+'</p><div class="suggestions">'+expenses.map(r=>'<button data-action="result-detail" data-id="'+esc(r.id)+'">'+esc(r.title)+' · ¥'+r.amount.toFixed(2)+' ↗</button>').join('')+'</div><p style="margin-top:20px">未调用真实 Agent。真实产品应由模型选源、工具查询，并返回可核对的引用。</p>');},1050);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,s=story();
 if(a==='story'){state.current=id;selected=null;save();render();$('app').classList.remove('menu-open');$('scroll-main').scrollTop=0;}
 else if(a==='detail'||a==='result-detail'){selected=id;if(a==='result-detail')$('modal').close();render();}
 else if(a==='close-detail'){selected=null;render();}
 else if(a==='settings'){$('settings').hidden=!$('settings').hidden;$('settings-toggle').setAttribute('aria-expanded',String(!$('settings').hidden));}
 else if(a==='menu'){$('app').classList.toggle('menu-open');}
 else if(a==='new'){newStory();}
 else if(a==='sources'){sourcesModal();$('settings').hidden=true;$('settings-toggle').setAttribute('aria-expanded','false');}
 else if(a==='space'){modal('我的空间','<p>这份原型无需账号，确认、排除和演示更新保存在当前浏览器中。</p><div class="log-row">保存方式：本机浏览器</div><div class="log-row">网络传输：无</div><div class="log-row">云端备份：规划中</div><p style="margin-top:15px">“本机保存”不等于备份。清理浏览器数据会移除这些原型操作。</p>');}
 else if(a==='cloud'){modal('备份与同步','<span class="pill neutral">规划中</span><p style="margin-top:20px">未来可选择备份哪些经历，以及是否包含原文和图片。</p><div class="source-setting"><span>云端备份<small>换设备时恢复经历与关联选择</small></span><button class="secondary" disabled>尚未开放</button></div><div class="source-setting"><span>多设备同步<small>同步更正、删除与用户决定</small></span><button class="secondary" disabled>尚未开放</button></div><p>此原型没有账号服务，不会上传数据。</p>');}
 else if(a==='import'){modal('文件导入','<p>原型仅提供内置样本载入，尚不解析用户文件。样本包含社媒、日历与账目，载入会作为一段新经历，不覆盖现有选择。</p><button class="primary" data-action="load-sample">载入攀岩演示样本</button>');}
 else if(a==='load-sample'){const fresh=structuredClone(initial[0]);fresh.id='sample-'+Date.now();fresh.name='攀岩样本 · 新导入';state.stories.push(fresh);state.current=fresh.id;selected='social:first';save();render();$('modal').close();notify('已载入内置模拟样本。');}
 else if(a==='confirm'||a==='unconfirm'){const k=key(s.id,id),old=state.confirmed[k];a==='confirm'?state.confirmed[k]=true:delete state.confirmed[k];save();render();notify(a==='confirm'?'已确认这组记录属于同一次经历。':'已恢复为待确认。',()=>{old?state.confirmed[k]=old:delete state.confirmed[k];save();render();});}
 else if(a==='review'){const g=s.groups.find(g=>g.id===id);modal('哪条记录不属于这件事？','<p>只调整当前经历中的关联，不会删除任何来源记录。</p>'+g.records.filter(r=>visible(s,r)).map(r=>'<div class="source-setting"><span>'+esc(r.title)+'<small>模拟'+names[r.source]+'</small></span><button class="secondary" data-action="exclude-modal" data-id="'+esc(r.id)+'">移除关联</button></div>').join(''));}
 else if(a==='exclude'||a==='exclude-modal'){exclude(id);if(a==='exclude-modal')$('modal').close();}
 else if(a==='undo'){const fn=undo;undo=null;$('toast').hidden=true;if(fn)fn();}
 else if(a==='excluded'){const rows=all(s).filter(r=>state.excluded[key(s.id,r.id)]);modal('已排除的记录','<p>这些记录仍在来源中。恢复后会重新参与当前经历。</p>'+rows.map(r=>'<div class="source-setting"><span>'+esc(r.title)+'<small>模拟'+names[r.source]+'</small></span><button class="secondary" data-action="restore" data-id="'+esc(r.id)+'">恢复</button></div>').join(''));}
 else if(a==='restore'){delete state.excluded[key(s.id,id)];save();render();$('modal').close();notify('记录已恢复到当前经历。');}
 else if(a==='update'){if(state.updated[s.id]){notify('再次检查完成：没有新的样本变化。');return;}const r=s.groups.flatMap(g=>g.records).find(r=>r.amount!=null);if(!r){notify('当前经历没有可更新的费用样本。');return;}const before=r.amount;r.amount=Math.max(0,r.amount-20);state.updated[s.id]=true;state.logs[s.id]=[{type:'更正',text:r.title+'：¥'+before.toFixed(2)+' → ¥'+r.amount.toFixed(2)+'，记录身份保持不变。'}];save();render();notify('模拟来源已更正 1 条，关联选择已保留。');}
 else if(a==='changes'){changes();}
 else if(a==='original'){const r=all(s).find(r=>r.id===selected);modal('原始样本记录','<p>来自模拟'+names[r.source]+'，没有真实外部链接。</p><h3>'+esc(r.title)+'</h3><p>'+esc(r.body)+'</p><dl class="meta-table"><dt>来源身份</dt><dd>'+esc(r.id)+'</dd><dt>时间</dt><dd>'+esc(r.time)+'</dd></dl>');}
 else if(a==='process'){modal('整理过程 · 演示说明','<p>以下是拟议交互，没有执行真实模型或工具调用。</p><div class="log-row"><strong>01</strong>理解主题与时间范围</div><div class="log-row"><strong>02</strong>按授权查询社媒、日历和账目</div><div class="log-row"><strong>03</strong>整理有依据的候选关系</div><div class="log-row"><strong>04</strong>由你确认不确定的关联</div><div class="suggestions"><button data-action="ask-sample">试试：实际花了多少钱？</button></div>');}
 else if(a==='ask-sample'){ask('这段经历实际花了多少钱？');}
 else if(a==='cancel-run'){runId++;running=false;$('modal').close();notify('已取消整理，没有改动任何记录。');}
 else if(a==='close-modal'){runId++;running=false;$('modal').close();}
 else if(a==='reset'){modal('重置演示','<p>只清除本原型保存的经历、排除、确认和模拟更新，恢复初始样本。不会影响真实 DailyFlow 数据。</p><div class="modal-footer"><button class="secondary" data-action="close-modal">取消</button><button class="primary" data-action="reset-confirm">恢复初始样本</button></div>');}
 else if(a==='reset-confirm'){runId++;running=false;state={stories:structuredClone(initial),current:'climb',excluded:{},confirmed:{},connected:{social:true,calendar:true,expense:true},updated:{},logs:{}};selected='social:first';save();render();$('modal').close();notify('已恢复初始演示。');}
});
$('search').addEventListener('input',renderDirectory);
document.addEventListener('change',e=>{if(e.target.dataset.source){state.connected[e.target.dataset.source]=e.target.checked;save();render();}});
document.addEventListener('submit',e=>{if(e.target.id==='new-form'){e.preventDefault();const name=$('story-name').value.trim();if(!name)return;const id='custom-'+Date.now();state.stories.push({id,name,short:'新经历',range:'尚未选择时间范围',summary:'从一条线索开始，让分散的记录慢慢连成这段经历。',groups:[]});state.current=id;selected=null;save();render();$('modal').close();}else if(e.target.id==='composer'){e.preventDefault();const q=$('question').value.trim();if(q)ask(q);}});
$('modal').addEventListener('cancel',()=>{runId++;running=false;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').open){$('settings').hidden=true;$('settings-toggle').setAttribute('aria-expanded','false');$('app').classList.remove('menu-open');}});
render();
})();
</script>
</body>
</html>
